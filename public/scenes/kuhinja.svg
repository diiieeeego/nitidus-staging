<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <pattern id="ktiles" width="60" height="30" patternUnits="userSpaceOnUse">
      <rect width="60" height="30" fill="#f4f6f5"/>
      <path d="M0 0H60M0 15H60M30 0V15M0 15V30M60 15V30" fill="none" stroke="#e1e6e4" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1200" height="620" fill="url(#ktiles)"/>
  <rect y="620" width="1200" height="180" fill="#c9cfcc"/>

  <!-- shelf -->
  <rect x="470" y="150" width="420" height="14" rx="3" fill="#a9b3b6"/>
  <rect x="500" y="100" width="44" height="50" rx="6" fill="#e3e8ea" stroke="#9aa6ab" stroke-width="3"/>
  <rect x="560" y="90" width="60" height="60" rx="6" fill="#e3e8ea" stroke="#9aa6ab" stroke-width="3"/>
  <circle cx="680" cy="125" r="25" fill="#e3e8ea" stroke="#9aa6ab" stroke-width="3"/>

  <!-- autocut towel dispenser (Marplast 884) -->
  <rect x="120" y="170" width="200" height="220" rx="22" fill="#ffffff" stroke="#9aa6ab" stroke-width="4"/>
  <circle cx="220" cy="260" r="48" fill="#eef3f4" stroke="#c4cbcc" stroke-width="3"/>
  <rect x="160" y="372" width="120" height="12" rx="6" fill="#9aa6ab"/>
  <path d="M176 380h88v60h-88z" fill="#ffffff" stroke="#c4cbcc" stroke-width="3"/>

  <!-- foam soap dispenser (Marplast 914) -->
  <rect x="360" y="250" width="84" height="146" rx="16" fill="#ffffff" stroke="#9aa6ab" stroke-width="4"/>
  <rect x="377" y="274" width="50" height="56" rx="6" fill="#eaf5e4"/>
  <rect x="393" y="396" width="18" height="18" rx="4" fill="#9aa6ab"/>

  <!-- steel counter -->
  <rect x="340" y="450" width="700" height="30" rx="4" fill="#d5dbdd" stroke="#9aa6ab" stroke-width="3"/>
  <rect x="360" y="480" width="660" height="140" fill="#e8ecee" stroke="#b8c2c5" stroke-width="3"/>
  <path d="M580 480v140M800 480v140" stroke="#b8c2c5" stroke-width="3"/>
  <!-- sink in counter -->
  <rect x="380" y="440" width="170" height="14" rx="4" fill="#b8c2c5"/>
  <path d="M465 440v-55a12 12 0 0 1 12-12h20" fill="none" stroke="#8d989c" stroke-width="9" stroke-linecap="round"/>

  <!-- hand dish detergent bottle -->
  <rect x="590" y="370" width="46" height="80" rx="10" fill="#74c054" opacity="0.85"/>
  <rect x="603" y="350" width="20" height="24" rx="4" fill="#3f7a2a"/>
  <rect x="598" y="395" width="30" height="26" rx="3" fill="#ffffff" opacity="0.8"/>

  <!-- grill cleaner spray -->
  <rect x="670" y="380" width="40" height="70" rx="8" fill="#fdba37"/>
  <path d="M676 380v-20h22l12 10v10z" fill="#5a5f61"/>

  <!-- dishwasher with detergent canister -->
  <rect x="820" y="490" width="190" height="125" rx="6" fill="#f7f9f9" stroke="#9aa6ab" stroke-width="3"/>
  <rect x="840" y="505" width="150" height="14" rx="4" fill="#c4cbcc"/>
  <rect x="1060" y="520" width="90" height="100" rx="12" fill="#ffffff" stroke="#9aa6ab" stroke-width="4"/>
  <rect x="1085" y="500" width="40" height="24" rx="5" fill="#3213da" opacity="0.8"/>
  <rect x="1072" y="550" width="66" height="40" rx="4" fill="#eef3f4"/>

  <!-- anti-slip mat -->
  <path d="M300 690h560l40 70H260z" fill="#3a3f41"/>
  <g fill="#575e61">
    <circle cx="360" cy="715" r="8"/><circle cx="420" cy="715" r="8"/><circle cx="480" cy="715" r="8"/>
    <circle cx="540" cy="715" r="8"/><circle cx="600" cy="715" r="8"/><circle cx="660" cy="715" r="8"/>
    <circle cx="720" cy="715" r="8"/><circle cx="780" cy="715" r="8"/><circle cx="340" cy="740" r="8"/>
    <circle cx="400" cy="740" r="8"/><circle cx="460" cy="740" r="8"/><circle cx="520" cy="740" r="8"/>
    <circle cx="580" cy="740" r="8"/><circle cx="640" cy="740" r="8"/><circle cx="700" cy="740" r="8"/>
    <circle cx="760" cy="740" r="8"/><circle cx="820" cy="740" r="8"/>
  </g>

  <!-- mop holder (Vermop Sprint) leaning on wall -->
  <path d="M1110 160L1020 640" stroke="#3f7a2a" stroke-width="12" stroke-linecap="round"/>
  <rect x="960" y="638" width="130" height="22" rx="6" fill="#ffd36b" stroke="#5a5f61" stroke-width="3"/>
  <path d="M968 660h114v14H968z" fill="#ffffff" stroke="#9aa6ab" stroke-width="2"/>
</svg>
