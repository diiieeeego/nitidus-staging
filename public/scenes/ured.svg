<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect width="1200" height="620" fill="#f1f3ef"/>
  <rect y="620" width="1200" height="180" fill="#d9d4cb"/>
  <rect y="612" width="1200" height="10" fill="#c8c2b7"/>

  <!-- window -->
  <rect x="80" y="90" width="330" height="300" rx="8" fill="#d6e8f0" stroke="#a9b3b6" stroke-width="6"/>
  <path d="M245 90v300M80 240h330" stroke="#a9b3b6" stroke-width="6"/>
  <path d="M110 120l60 0-60 60z" fill="#ffffff" opacity="0.6"/>

  <!-- glass cleaner on windowsill -->
  <rect x="300" y="330" width="40" height="70" rx="8" fill="#3213da" opacity="0.75"/>
  <path d="M306 330v-20h22l12 10v10z" fill="#5a5f61"/>
  <rect x="80" y="398" width="330" height="12" fill="#c4cbcc"/>

  <!-- kitchenette counter -->
  <rect x="700" y="450" width="440" height="26" rx="4" fill="#ffffff" stroke="#9aa6ab" stroke-width="3"/>
  <rect x="715" y="476" width="410" height="144" fill="#f6f4ef" stroke="#c8c2b7" stroke-width="3"/>
  <path d="M920 476v144" stroke="#c8c2b7" stroke-width="3"/>

  <!-- centrefeed dispenser (Marplast 935) -->
  <rect x="760" y="170" width="150" height="210" rx="22" fill="#ffffff" stroke="#9aa6ab" stroke-width="4"/>
  <circle cx="835" cy="260" r="50" fill="#eef3f4" stroke="#c4cbcc" stroke-width="3"/>
  <path d="M822 380h26l-4 46h-18z" fill="#ffffff" stroke="#c4cbcc" stroke-width="3"/>

  <!-- surface disinfectant + cloths on counter -->
  <rect x="980" y="380" width="42" height="72" rx="8" fill="#74c054" opacity="0.9"/>
  <path d="M986 380v-22h22l12 10v12z" fill="#5a5f61"/>
  <path d="M1040 440h80l-6 12h-80z" fill="#3213da" opacity="0.7"/>
  <path d="M1045 428h76l-6 12h-76z" fill="#fdba37"/>

  <!-- desk -->
  <rect x="300" y="500" width="340" height="20" rx="4" fill="#b99b76"/>
  <rect x="320" y="520" width="16" height="100" fill="#9d8160"/>
  <rect x="604" y="520" width="16" height="100" fill="#9d8160"/>
  <rect x="400" y="430" width="140" height="70" rx="6" fill="#5a5f61"/>
  <rect x="460" y="500" width="20" height="4" fill="#5a5f61"/>

  <!-- hand sanitiser on desk -->
  <rect x="570" y="450" width="34" height="50" rx="8" fill="#ffffff" stroke="#9aa6ab" stroke-width="3"/>
  <rect x="580" y="432" width="14" height="20" rx="3" fill="#74c054"/>

  <!-- rectangular bin (Marplast 579) -->
  <rect x="210" y="530" width="90" height="100" rx="8" fill="#ffffff" stroke="#9aa6ab" stroke-width="4"/>
  <rect x="204" y="522" width="102" height="16" rx="6" fill="#e3e8ea" stroke="#9aa6ab" stroke-width="3"/>

  <!-- plant -->
  <rect x="1120" y="560" width="50" height="60" rx="6" fill="#c8c2b7"/>
  <path d="M1145 560c-30-40-20-90 0-110 20 20 30 70 0 110zM1145 560c-50-20-60-60-50-80 25 5 50 40 50 80zM1145 560c50-20 60-60 50-80-25 5-50 40-50 80z" fill="#74c054"/>
